[project]
name = "lambdaquery"
version = "0.1.0"
description = "Programmatic access to NASA LAMBDA archive data."
readme = "README.md"
authors = [
    { name = "Nathan Miller", email = "Nathan.J.Miller@nasa.gov" }
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.20",
    "requests>=2.25",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]

[project.scripts]
lambdaquery = "lambdaquery._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipython>=8.18",
    "jupyterlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.15.20",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
# Pin to requires-python so syntax newer than the floor (match statements, PEP
# 695 generics) is flagged here rather than in a 3.10 user's traceback.
target-version = "py310"
# The demo notebook bootstraps sys.path before importing, so its imports can't sit
# at the top of the cell, and `console` isn't resolvable statically. Linting it
# would only add noqa noise to a file meant to be read by newcomers.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"] # pycodestyle, pyflakes, isort

[tool.ty.src]
exclude = ["notebooks"] # see the ruff note above

[tool.ty.environment]
python-version = "3.10" # keep in sync with requires-python

[tool.ty.terminal]
error-on-warning = true
