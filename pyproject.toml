[project]
name = "lambdaquery"
version = "0.1.0"
description = "Access LAMBDA data."
readme = "README.md"
authors = [
    { name = "Nathan Miller", email = "Nathan.J.Miller@nasa.gov" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.41",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.32",
    "ipython>=9.16.1",
    "jupyterlab>=4.5",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
# The demo notebook bootstraps sys.path before importing, so its imports can't sit
# at the top of the cell, and `console` isn't resolvable statically. Linting it
# would only add noqa noise to a file meant to be read by newcomers.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"] # pycodestyle, pyflakes, isort

[tool.ty.src]
exclude = ["notebooks"] # see the ruff note above

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true
